<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 5-Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="bg-indigo-600 text-white w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-2xl font-black text-white">The 5-Day Challenge</h2>
                <p class="text-xs text-slate-400">سجل حسابك وابدأ بتجميع النقاط والمنافسة!</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">اسمك الكامل:</label>
                    <input type="text" id="auth-name" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="اكتب اسمك هنا...">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">البريد الإلكتروني (لحفظ نقاطك):</label>
                    <input type="email" id="auth-email" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="name@example.com">
                </div>
                <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3.5 rounded-xl font-bold shadow-lg transition text-sm">
                    دخول التحدي 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- الهيدر -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-trophy text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">5-Day Challenge</h1>
                    <p class="text-xs text-indigo-400" id="current-user-display">مرحباً بك</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-slate-700/60 px-3 py-1.5 rounded-lg border border-slate-600 text-sm">
                    <span class="text-indigo-300 font-bold" id="header-score">0</span> نقطة
                </div>
                <button onclick="requestAdminAccess()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-gears"></i> لوحة الأدمن
                </button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
        <section class="bg-gradient-to-r from-indigo-950 via-slate-900 to-purple-950 p-6 rounded-2xl border border-indigo-500/30 shadow-xl">
            <h2 class="text-xl font-black mb-1 text-white">أيام التحدي</h2>
            <p class="text-slate-400 text-xs mb-4">اختر اليوم لعرض التحدي الخاص به وإرسال إجابتك:</p>
            <div class="grid grid-cols-5 gap-2" id="days-tabs"></div>
        </section>

        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl" id="challenge-card-container"></section>

        <!-- لوحة الصدارة (Top Participants) -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-md font-bold flex items-center gap-2 text-white">
                    <i class="fa-solid fa-medal text-amber-400"></i> لوحة الصدارة (Top Participants)
                </h3>
                <span class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">محدث سحابياً فورياً</span>
            </div>
            <div class="divide-y divide-slate-700" id="leaderboard-list">
                <p class="text-xs text-slate-400 text-center py-2">جاري جلب لوحة الصدارة...</p>
            </div>
        </section>
    </main>

    <!-- لوحة التحكم (الأدمن) -->
    <div id="admin-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-pen-nib text-amber-400"></i> لوحة التحكم</h3>
                <button onclick="closeModal('admin-modal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">اختر اليوم للتعديل:</label>
                    <select id="admin-day-select" onchange="loadAdminDayData()" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white">
                        <option value="1">اليوم الأول</option>
                        <option value="2">اليوم الثاني</option>
                        <option value="3">اليوم الثالث</option>
                        <option value="4">اليوم الرابع</option>
                        <option value="5">اليوم الخامس</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">عنوان التحدي:</label>
                    <input type="text" id="admin-title" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">نص السؤال أو الحالة:</label>
                    <textarea id="admin-desc" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-white"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-amber-400 mb-1">⭐ الإجابة النموذجية الصحيحة (للتصحيح التلقائي):</label>
                    <input type="text" id="admin-model-answer" class="w-full bg-slate-800 border border-amber-500 rounded-xl p-2.5 text-sm text-white" placeholder="مثال: باراسيتامول">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal('admin-modal')" class="px-4 py-2 bg-slate-800 rounded-xl text-xs font-semibold">إلغاء</button>
                <button onclick="saveAdminChanges()" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 rounded-xl text-xs font-bold text-white shadow">حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <!-- نافذة إرسال الإجابة -->
    <div id="submit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-white">إرسال إجابة التحدي</h3>
            <p class="text-xs text-slate-300" id="modal-ch-title"></p>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">إجابتك / حلك:</label>
                <textarea id="user-answer-text" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="اكتب إجابتك هنا..."></textarea>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('submit-modal')" class="px-4 py-2 bg-slate-800 rounded-xl text-xs font-semibold">إلغاء</button>
                <button onclick="submitUserAnswer()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs font-bold text-white shadow">تحقق وأرسل</button>
            </div>
        </div>
    </div>

    <!-- رسالة التنبيه -->
    <div id="toast" class="fixed bottom-5 left-5 bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-xl hidden text-xs font-bold z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-text">تم بنجاح</span>
    </div>

    <!-- الجافاسكريبت والربط السحابي (Firebase) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateCode, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // إعدادات فايربيس الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyBMxfI1fHY0nXbkrX3Vl9a1Zq_h-85mS8Y",
            authDomain: "challenge5days.firebaseapp.com",
            projectId: "challenge5days",
            storageBucket: "challenge5days.appspot.com",
            messagingSenderId: "404505595178",
            appId: "1:404505595178:web:8d514856f4d3663b655f01"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = JSON.parse(localStorage.getItem('current_user_v6')) || null;
        let currentDay = 1;
        const ADMIN_SECRET = "1234";

        // التحديات الافتراضية
        let challenges = JSON.parse(localStorage.getItem('challenges_data_v6')) || {
            1: { title: "تحدي الكلينيكال", desc: "أدخل السؤال هنا...", modelAnswer: "باراسيتامول" },
            2: { title: "تحدي التواصل", desc: "أدخل السؤال هنا...", modelAnswer: "اتصال" },
            3: { title: "تحدي الأونكولوجي", desc: "أدخل السؤال هنا...", modelAnswer: "أورام" },
            4: { title: "صناعة المحتوى", desc: "أدخل السؤال هنا...", modelAnswer: "محتوى" },
            5: { title: "تحدي الفريلانسينج", desc: "أدخل السؤال هنا...", modelAnswer: "فريق" }
        };

        window.handleLogin = async function() {
            const name = document.getElementById('auth-name').value.trim();
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            if(!name || !email) {
                alert("الرجاء إدخال الاسم والبريد الإلكتروني!");
                return;
            }
            currentUser = { name: name, email: email };
            localStorage.setItem('current_user_v6', JSON.stringify(currentUser));
            
            // التحقق من قاعدة البيانات سحابياً وتسجيل المستخدم إذا لم يكن موجوداً
            try {
                const userRef = doc(db, "users", email);
                const userSnap = await getDoc(userRef);
                if(!userSnap.exists()) {
                    await setDoc(userRef, { name: name, email: email, score: 0, solvedDays: [] });
                } else {
                    await setDoc(userRef, { name: name }, { merge: true }); // تحديث الاسم لو تغير
                }
            } catch(e) {
                console.log("خطأ في الاتصال بقاعدة البيانات", e);
            }

            location.reload();
        };

        async function initApp() {
            if(currentUser) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('current-user-display').innerText = `مرحباً، ${currentUser.name}`;
                await updateScoreHeader();
                renderDaysTabs();
                renderChallengeCard();
                renderLeaderboard();
            }
        }

        window.switchDay = function(day) {
            currentDay = day;
            renderDaysTabs();
            renderChallengeCard();
        };

        function renderDaysTabs() {
            const container = document.getElementById('days-tabs');
            container.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const active = currentDay === i;
                container.innerHTML += `
                    <button onclick="switchDay(${i})" class="p-2.5 rounded-xl text-center font-bold text-xs transition border ${active ? 'bg-indigo-600 border-indigo-400 text-white shadow-lg' : 'bg-slate-900 border-slate-800 text-slate-400 hover:bg-slate-800'}">
                        <div>اليوم</div>
                        <div class="text-base">${i}</div>
                    </button>
                `;
            }
        }

        function renderChallengeCard() {
            const ch = challenges[currentDay];
            const container = document.getElementById('challenge-card-container');
            container.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-3">
                    <div>
                        <h3 class="text-lg font-bold text-white">${ch.title}</h3>
                    </div>
                    <button onclick="openSubmitModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow transition flex items-center gap-1.5">
                        <i class="fa-solid fa-paper-plane"></i> حل التحدي وإرسال الإجابة
                    </button>
                </div>
                <p class="text-slate-300 text-xs leading-relaxed bg-slate-900/60 p-3.5 rounded-xl border border-slate-700/50">${ch.desc}</p>
            `;
        }

        async function renderLeaderboard() {
            const container = document.getElementById('leaderboard-list');
            try {
                const q = query(collection(db, "users"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);
                container.innerHTML = '';
                
                let usersList = [];
                querySnapshot.forEach((doc) => {
                    usersList.push(doc.data());
                });

                if(usersList.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">لا يوجد مشاركون بعد.</p>`;
                    return;
                }

                usersList.forEach((u, idx) => {
                    container.innerHTML += `
                        <div class="flex items-center justify-between py-2.5 text-xs">
                            <div class="flex items-center gap-2.5">
                                <span class="font-bold text-amber-400">#${idx+1}</span>
                                <span class="font-semibold text-white">${u.name}</span>
                            </div>
                            <span class="text-indigo-400 font-bold bg-indigo-950/40 px-2.5 py-1 rounded border border-indigo-900/50">${u.score} نقطة</span>
                        </div>
                    `;
                });
            } catch(e) {
                container.innerHTML = `<p class="text-xs text-red-400 text-center py-2">خطأ في تحميل لوحة الصدارة سحابياً.</p>`;
            }
        }

        async function updateScoreHeader() {
            try {
                const userRef = doc(db, "users", currentUser.email);
                const userSnap = await getDoc(userRef);
                if(userSnap.exists()) {
                    document.getElementById('header-score').innerText = userSnap.data().score || 0;
                }
            } catch(e) {
                console.log(e);
            }
        }

        window.requestAdminAccess = function() {
            const pass = prompt("أدخل كلمة مرور الأدمن:");
            if(pass === ADMIN_SECRET) {
                openAdminPanel();
            } else if(pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        };

        function openAdminPanel() {
            loadAdminDayData();
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-modal').classList.add('flex');
        }

        window.loadAdminDayData = function() {
            const day = document.getElementById('admin-day-select').value;
            const ch = challenges[day];
            document.getElementById('admin-title').value = ch.title;
            document.getElementById('admin-desc').value = ch.desc;
            document.getElementById('admin-model-answer').value = ch.modelAnswer || "";
        };

        window.saveAdminChanges = function() {
            const day = document.getElementById('admin-day-select').value;
            challenges[day] = {
                title: document.getElementById('admin-title').value,
                desc: document.getElementById('admin-desc').value,
                modelAnswer: document.getElementById('admin-model-answer').value
            };
            localStorage.setItem('challenges_data_v6', JSON.stringify(challenges));
            closeModal('admin-modal');
            renderChallengeCard();
            showToast("تم تحديث التحدي والإجابة النموذجية بنجاح!");
        };

        window.openSubmitModal = function() {
            document.getElementById('modal-ch-title').innerText = challenges[currentDay].title;
            document.getElementById('user-answer-text').value = '';
            document.getElementById('submit-modal').classList.remove('hidden');
            document.getElementById('submit-modal').classList.add('flex');
        };

        window.closeModal = function(id) {
            document.getElementById(id).classList.remove('flex');
            document.getElementById(id).classList.add('hidden');
        };

        window.submitUserAnswer = async function() {
            const userAns = document.getElementById('user-answer-text').value.trim().toLowerCase();
            const modelAns = (challenges[currentDay].modelAnswer || "").trim().toLowerCase();

            if(!userAns) {
                alert("الرجاء كتابة الحل أولاً!");
                return;
            }

            if(!modelAns) {
                alert("عذراً، لم يقم الأدمن بتحديد إجابة نموذجية لهذا التحدي بعد!");
                return;
            }

            try {
                const userRef = doc(db, "users", currentUser.email);
                const userSnap = await getDoc(userRef);
                let userData = userSnap.data();

                if(userData.solvedDays && userData.solvedDays.includes(currentDay)) {
                    alert("لقد قمت بحل هذا التحدي مسبقاً ولا يمكنك تكرار أخذ النقاط!");
                    closeModal('submit-modal');
                    return;
                }

                if(userAns.includes(modelAns) || modelAns.includes(userAns)) {
                    userData.score = (userData.score || 0) + 100;
                    if(!userData.solvedDays) userData.solvedDays = [];
                    userData.solvedDays.push(currentDay);

                    await setDoc(userRef, userData);
                    
                    await updateScoreHeader();
                    await renderLeaderboard();
                    closeModal('submit-modal');
                    showToast("إجابة صحيحة! تم إضافة 100 نقطة بنجاح 🎉");
                } else {
                    alert("عذراً، الإجابة غير مطابقة للإجابة النموذجية الصحيحة. حاول مجدداً!");
                }
            } catch(e) {
                alert("حدث خطأ أثناء الاتصال بقاعدة البيانات، تأكد من اتصال الإنترنت.");
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => { t.classList.add('hidden'); }, 3500);
        }

        initApp();
    </script>
</body>
</html>
